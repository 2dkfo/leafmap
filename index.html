<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cut">
<title>LeafMap</title>
<meta name="description" content="LeafMap — Busan vegetarian map prototype that checks menu ingredients and sauce labels against the foods you avoid.">
<meta name="theme-color" content="#245c45">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23245c45'/%3E%3Cpath d='M18 46c0-18 12-28 30-28 0 18-10 30-28 30l-2-2z' fill='%23e8f1ea'/%3E%3Cpath d='M20 44 40 26' stroke='%23245c45' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{
    --green:#245c45; --green-2:#2f7457; --green-soft:#e8f1ea; --green-line:#c9dfd0;
    --amber:#9a5b06; --amber-soft:#fff3dc; --amber-line:#f1d7a6;
    --red:#a8322a; --red-soft:#fdecea; --red-line:#f2c4bf;
    --ink:#1d2a24; --ink-2:#55635c; --ink-3:#8a968f;
    --bg:#f6f4ee; --card:#ffffff; --line:#e3e6e1; --shadow:0 1px 2px rgba(20,40,30,.06),0 4px 14px rgba(20,40,30,.06);
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  a{color:var(--green)}
  .app{max-width:440px;margin:0 auto;min-height:100vh;min-height:100dvh;background:#fbfaf6;display:flex;flex-direction:column;position:relative}
  @media (min-width:520px){
    body{padding:24px 0}
    .app{min-height:calc(100vh - 48px);border-radius:28px;box-shadow:0 10px 40px rgba(20,40,30,.14);overflow:hidden}
  }
  .demo-bar{background:var(--green);color:#e8f1ea;font-size:12px;padding:6px 16px;text-align:center}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px;gap:8px}
  .brand{display:flex;align-items:center;gap:6px;font-weight:700;font-size:21px;color:var(--green);text-decoration:none;letter-spacing:-.3px}
  .brand svg{width:20px;height:20px}
  .back{display:flex;align-items:center;gap:4px;background:none;border:0;padding:6px 4px;font-weight:500;color:var(--ink)}
  .lang{display:flex;background:var(--green-soft);border-radius:999px;padding:3px}
  .lang button{border:0;background:none;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:500;color:var(--green)}
  .lang button[aria-pressed="true"]{background:var(--green);color:#fff}
  main{flex:1;padding:4px 16px 96px;overflow-x:hidden}
  h1{font-size:23px;margin:6px 0 4px;letter-spacing:-.4px}
  h2{font-size:16px;margin:22px 0 8px}
  .sub{color:var(--ink-2);margin:0 0 14px;font-size:14px}
  .muted{color:var(--ink-3);font-size:13px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  /* diet options */
  .options{display:grid;gap:8px}
  .opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}
  .opt .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--ink-3);flex:none;margin-top:2px;display:grid;place-items:center}
  .opt[aria-checked="true"]{border-color:var(--green);background:var(--green-soft)}
  .opt[aria-checked="true"] .dot{border-color:var(--green)}
  .opt[aria-checked="true"] .dot::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--green)}
  .opt b{display:block;font-weight:700}
  .opt span{font-size:13px;color:var(--ink-2)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1.5px solid var(--green-line);background:#fff;color:var(--green);border-radius:10px;padding:7px 12px;font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:6px}
  .chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
  .chip[aria-pressed="true"]::before{content:"✓";font-size:12px}
  .note{border-radius:12px;padding:10px 12px;font-size:13px;margin-top:12px}
  .note.info{background:var(--green-soft);color:var(--green)}
  .note.warn{background:var(--amber-soft);color:var(--amber);border:1px solid var(--amber-line)}
  .summary{margin-top:16px;padding:12px 14px}
  .summary b{font-size:13px;color:var(--ink-2);font-weight:500;display:block;margin-bottom:4px}
  .btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;border:0;border-radius:12px;padding:14px;font-weight:700;background:var(--green);color:#fff;text-decoration:none;font-size:15px}
  .btn:active{background:var(--green-2)}
  .btn.ghost{background:#fff;color:var(--green);border:1.5px solid var(--green)}
  .btn[disabled]{opacity:.45;cursor:not-allowed}
  .stack{display:grid;gap:10px;margin-top:18px}
  /* explore */
  .search{display:flex;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .search input{border:0;outline:0;flex:1;background:none;min-width:0}
  .seg{display:flex;gap:6px;margin:10px 0;overflow-x:auto}
  .seg button{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:500}
  .seg button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .filterline{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--ink-2);margin-bottom:10px}
  .filterline a{font-weight:500;white-space:nowrap}
  #map{height:230px;border-radius:var(--radius);border:1px solid var(--line);overflow:hidden;background:#e6ece7;z-index:0}
  .pin{width:34px;height:34px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);display:grid;place-items:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25)}
  .pin span{transform:rotate(45deg);color:#fff;font-weight:700;font-size:13px}
  .pin.ok{background:var(--green)} .pin.check{background:#c98512} .pin.none{background:#9aa39e}
  .list{display:grid;gap:10px;margin-top:14px}
  .place{display:flex;gap:12px;padding:12px;text-decoration:none;color:inherit;align-items:center}
  .thumb{width:58px;height:58px;border-radius:12px;display:grid;place-items:center;font-size:28px;flex:none;background:var(--green-soft)}
  .place .info{flex:1;min-width:0}
  .place .name{font-weight:700}
  .place .meta{font-size:13px;color:var(--ink-2)}
  .counts{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
  .badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;border-radius:999px;padding:2px 9px;white-space:nowrap}
  .badge.ok{background:var(--green-soft);color:var(--green)}
  .badge.check{background:var(--amber-soft);color:var(--amber)}
  .badge.contains{background:var(--red-soft);color:var(--red)}
  .chev{color:var(--ink-3);font-size:20px}
  .empty{text-align:center;padding:28px 16px;color:var(--ink-2)}
  .empty .big{font-size:34px}
  /* menu */
  .menu-row{display:flex;gap:12px;align-items:center;padding:12px;text-decoration:none;color:inherit}
  .hero{height:170px;border-radius:var(--radius);display:grid;place-items:center;font-size:76px;margin-bottom:14px;position:relative}
  .hero .save{position:absolute;top:10px;right:10px;background:#fff;border:0;border-radius:10px;width:40px;height:40px;font-size:18px;box-shadow:var(--shadow)}
  .status{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:12px;margin:12px 0;border:1px solid}
  .status .ico{font-size:18px;line-height:1.2}
  .status b{display:block}
  .status span{font-size:13px}
  .status.ok{background:var(--green-soft);border-color:var(--green-line);color:var(--green)}
  .status.check{background:var(--amber-soft);border-color:var(--amber-line);color:var(--amber)}
  .status.contains{background:var(--red-soft);border-color:var(--red-line);color:var(--red)}
  .comp{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 11px;font-size:13px;background:#eef0ec;border:1px solid transparent}
  .comp.check{background:var(--amber-soft);border-color:var(--amber-line);color:var(--amber)}
  .comp.contains{background:var(--red-soft);border-color:var(--red-line);color:var(--red)}
  .group h3{font-size:13px;color:var(--ink-2);margin:14px 0 6px;font-weight:500}
  /* evidence */
  .ev{padding:14px;margin-top:12px}
  .ev-head{display:flex;gap:12px;align-items:center}
  .bottle{width:52px;height:52px;border-radius:10px;background:var(--green-soft);display:grid;place-items:center;font-size:26px;flex:none}
  .ev-head b{display:block}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px;margin-top:10px}
  .kv dt{color:var(--ink-3)} .kv dd{margin:0}
  .label-box{display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px}
  .label-box div{background:#f4f3ee;border-radius:10px;padding:9px 11px;font-size:13px}
  .label-box small{display:block;color:var(--ink-3);font-size:11px;font-weight:500;letter-spacing:.3px;text-transform:uppercase;margin-bottom:2px}
  .found{font-size:13px;border-radius:10px;padding:8px 10px;margin-top:10px}
  .found.ok{background:var(--green-soft);color:var(--green)}
  .found.contains{background:var(--red-soft);color:var(--red)}
  .found.check{background:var(--amber-soft);color:var(--amber)}
  .rest{display:flex;gap:8px;align-items:flex-start;font-size:13px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
  /* tabbar */
  .tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:500}
  @media (min-width:520px){.tabbar{position:sticky;transform:none;left:auto;bottom:0}}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--ink-3);text-decoration:none;padding:4px}
  .tabbar a svg{width:22px;height:22px}
  .tabbar a.on{color:var(--green);font-weight:700}
  /* modal */
  .modal{position:fixed;inset:0;background:rgba(15,25,20,.45);display:none;align-items:flex-end;justify-content:center;z-index:1000}
  .modal.open{display:flex}
  .sheet{background:#fff;width:100%;max-width:440px;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
  .sheet h2{margin-top:0}
  .ko-req{font-size:19px;line-height:1.65;background:var(--green-soft);color:var(--ink);border-radius:12px;padding:16px;font-weight:500}
  .field{display:grid;gap:6px;margin-top:12px}
  .field label{font-size:13px;font-weight:500;color:var(--ink-2)}
  .field select,.field textarea{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;width:100%}
  .field textarea{min-height:90px;resize:vertical}
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;z-index:1100;pointer-events:none;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .report{padding:12px;font-size:13px}
  .footer-note{font-size:12px;color:var(--ink-3);margin-top:24px;text-align:center}
  :focus-visible{outline:2px solid var(--green);outline-offset:2px}
</style>
</head>
<body>
<div class="app">
  <div class="demo-bar" id="demoBar"></div>
  <header class="topbar" id="topbar"></header>
  <main id="view" tabindex="-1"></main>
  <nav class="tabbar" id="tabbar"></nav>
</div>
<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast" role="status"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* =========================================================

  t_ingredient:{en:"Ingredients",ko:"기본 재료"}, t_broth:{en:"Broth",ko:"육수"}, t_sauce:{en:"Sauce",ko:"소스·양념"}, t_side:{en:"Side dishes",ko:"반찬"},

const STORE_KEY="leafmap-state-v1";

try{const s=JSON.parse(localStorage.getItem(STORE_KEY)||"null");if(s&&typeof s==="object")state=Object.assign(state,s);}catch(e){}
function persist(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state));}catch(e){}}

const lg=()=>state.lang;
const josa=(w,a,b)=>{const c=w.charCodeAt(w.length-1);return (c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28)?a:b;};
const t=k=>(T[k]?T[k][lg()]:k);
const tx=o=>o[lg()]||o.en;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const catNames=arr=>arr.map(c=>tx(CAT[c])).join(lg()==="ko"?"·":", ");

// ---------- judgement ----------
function compContains(c){return c.product?PRODUCTS[c.product].contains:(c.contains||[]);}
function judgeComp(c){
  const hits=compContains(c).filter(x=>state.excluded.includes(x));
  if(c.unknown)return{s:"check",hits:[]};
  if(c.rest==="confirmed"&&hits.length)return{s:"contains",hits};
  if(c.rest!=="confirmed")return{s:"check",hits};
  return{s:"ok",hits:[]};
}
function judgeMenu(m){
  const r=m.comps.map(judgeComp);
  const containHits=[...new Set(r.filter(x=>x.s==="contains").flatMap(x=>x.hits))];
  if(containHits.length)return{s:"contains",hits:containHits};
  if(r.some(x=>x.s==="check"))return{s:"check",hits:[]};
  return{s:"ok",hits:[]};
}
function placeMenus(pid){return Object.values(MENUS).filter(m=>m.place===pid);}
function placeCounts(pid){
  const c={ok:0,check:0,contains:0};placeMenus(pid).forEach(m=>c[judgeMenu(m).s]++);return c;
}

function viewExplore(){
  renderTop();renderTabs("explore");
  const q=state.q.trim().toLowerCase();
  let places=PLACES.filter(p=>state.area==="all"||p.area===state.area);
  if(q)places=places.filter(p=>[p.name.en,p.name.ko,...placeMenus(p.id).flatMap(m=>[m.name.en,m.name.ko])].some(s=>s.toLowerCase().includes(q)));
  const rows=places.map(p=>({p,c:placeCounts(p.id)})).filter(x=>x.c.ok+x.c.check>0)
    .sort((a,b)=>b.c.ok-a.c.ok||b.c.check-a.c.check);
  const list=rows.length?rows.map(({p,c})=>`
    <a class="card place" href="#/place/${p.id}">
      <div class="thumb">${p.emoji}</div>
      <div class="info"><div class="name">${esc(tx(p.name))}</div>
        <div class="meta">${t(p.area)} · ${t("demoPlace")}</div>
        <div class="counts">${c.ok?`<span class="badge ok">${c.ok} ${t("matches")}</span>`:""}${c.check?`<span class="badge check">${c.check} ${t("toConfirm")}</span>`:""}</div>
      </div><span class="chev">›</span></a>`).join("")
    :`<div class="card empty"><div class="big">🥕</div><p><b>${t("noResults")}</b></p><p class="muted">${t("noResultsTip")}</p></div>`;
  setView(`
    <label class="search">${ICON.search}<input id="q" type="search" value="${esc(state.q)}" placeholder="${t("search")}" aria-label="${t("search")}"></label>
    <div class="seg" role="group">${["all","haeundae","seomyeon"].map(a=>`<button data-area="${a}" aria-pressed="${state.area===a}">${t(a)}</button>`).join("")}</div>
    <div class="filterline"><span>${t("filterBy")}: <b>${state.excluded.length?esc(catNames(state.excluded)):"—"}</b></span><a href="#/setup">${t("edit")}</a></div>
    <div id="map" role="img" aria-label="Map of Busan"></div>
    <div class="list">${list}</div>`);
  initMap(rows.map(r=>r.p),rows);
  const qi=document.getElementById("q");
  qi.addEventListener("input",e=>{state.q=e.target.value;persist();clearTimeout(qi._t);qi._t=setTimeout(()=>{const pos=qi.selectionStart;viewExplore();const n=document.getElementById("q");n.focus();try{n.setSelectionRange(pos,pos);}catch(_){}} ,250);});
}
function initMap(places,rows){
  killMap();
  if(typeof L_==="undefined"||!L_){return;}
  const el=document.getElementById("map");if(!el)return;
  const centers={all:[35.165,129.11,12],haeundae:[35.1612,129.1615,15],seomyeon:[35.1573,129.061,15]};
  const [la,lo,z]=centers[state.area];
  map=L_.map(el,{zoomControl:false,attributionControl:true}).setView([la,lo],z);
  L_.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
  rows.forEach(({p,c})=>{
    const cls=c.ok?"ok":c.check?"check":"none";
    const icon=L_.divIcon({className:"",html:`<div class="pin ${cls}"><span>${c.ok||c.check}</span></div>`,iconSize:[34,34],iconAnchor:[17,34]});
    L_.marker([p.lat,p.lng],{icon,title:tx(p.name)}).addTo(map).on("click",()=>{location.hash="#/place/"+p.id;});
  });
  if(rows.length>1&&state.area!=="all"){map.fitBounds(rows.map(r=>[r.p.lat,r.p.lng]),{padding:[40,40],maxZoom:16});}
}

function statusBox(j){

}

  const p=PLACES.find(x=>x.id===id);if(!p)return viewNotFound();
  renderTop("#/explore");renderTabs("explore");
  const ms=placeMenus(id).map(m=>({m,j:judgeMenu(m)})).sort((a,b)=>({ok:0,check:1,contains:2}[a.j.s]-{ok:0,check:1,contains:2}[b.j.s]));
  setView(`
    <div class="hero" style="background:var(--green-soft)">${p.emoji}</div>
    <h1>${esc(tx(p.name))}</h1><p class="sub">${t(p.area)} · ${t("demoPlace")}</p>
    <h2>${t("menus")}</h2>
    <div class="list" style="margin-top:0">${ms.map(({m,j})=>`
      <a class="card menu-row" href="#/menu/${m.id}"><div class="thumb">${m.emoji}</div>
        <div class="info" style="flex:1;min-width:0"><div class="name" style="font-weight:700">${esc(tx(m.name))}</div>
        <div class="counts"><span class="badge ${j.s}">${ST_ICON[j.s]} ${t("st_"+j.s)}</span></div></div><span class="chev">›</span></a>`).join("")}
    </div>`);
}

function viewMenu(id){
  const m=MENUS[id];if(!m)return viewNotFound();
  const p=PLACES.find(x=>x.id===m.place);
  renderTop("#/place/"+p.id);renderTabs("explore");
  const j=judgeMenu(m);const isSaved=state.saved.includes(id);
  const groups=["ingredient","broth","sauce","side"].map(ty=>{
    const cs=m.comps.filter(c=>c.type===ty);if(!cs.length)return"";
    return `<div class="group"><h3>${t("t_"+ty)}</h3><div class="chips">${cs.map(c=>{const r=judgeComp(c);
      const extra=c.product?` · ${esc(PRODUCTS[c.product].name.split(" · ")[0])}`:"";
      return `<span class="comp ${r.s==="ok"?"":r.s}">${r.s!=="ok"?ST_ICON[r.s]+" ":""}${esc(tx(c.name))}${extra}</span>`;}).join("")}</div></div>`;
  }).join("");
  setView(`
    <div class="hero" style="background:#f1ece2">${m.emoji}
      <button class="save" data-save="${id}" aria-pressed="${isSaved}" aria-label="${t("saved")}">${isSaved?"★":"☆"}</button></div>
    <div class="muted">${esc(tx(p.name))} · ${t("demoPlace")}</div>
    <h1>${esc(tx(m.name))}</h1><p class="sub">${esc(tx(m.desc))}</p>
    ${statusBox(j)}
    ${groups}
    <div class="stack"><a class="btn" href="#/evidence/${id}">${t("seeEvidence")} ›</a></div>`);
}

function viewEvidence(id){
  const m=MENUS[id];if(!m)return viewNotFound();
  renderTop("#/menu/"+id);renderTabs("explore");
  const cards=m.comps.filter(c=>c.product||c.unknown||c.type==="broth"||c.type==="sauce").map(c=>{
    const r=judgeComp(c);
    const restLine=c.rest==="confirmed"
      ?`<div class="rest"><span>✓</span><div><b>${t("restConfirmed")}</b><div class="muted">${c.restDate||""}</div></div></div>`
      :`<div class="rest" style="color:var(--amber)"><span>⏱</span><div><b>${t("restPending")}</b><div>${t("restPendingD")}</div></div></div>`;
    if(c.unknown){
      return `<div class="card ev"><div class="ev-head"><div class="bottle">❔</div><div><b>${esc(tx(c.name))}</b><span class="muted">${t("t_"+c.type)}</span></div></div>
        <div class="found check">⏱ <b>${t("unknownProd")}</b> — ${t("unknownProdD")}</div>${restLine}</div>`;
    }
    if(!c.product){
      const hits=(c.contains||[]).filter(x=>state.excluded.includes(x));
      return `<div class="card ev"><div class="ev-head"><div class="bottle">🥣</div><div><b>${esc(tx(c.name))}</b><span class="muted">${t("t_"+c.type)} · ${t("houseMade")}</span></div></div>
        ${hits.length?`<div class="found ${r.s}">${t("found")} ${esc(catNames(hits))}</div>`:`<div class="found ok">✓ ${t("noneFound").replace(/label|성분표/,lg()==="ko"?"레시피":"recipe")}</div>`}${restLine}</div>`;
    }
    const pr=PRODUCTS[c.product];const hits=pr.contains.filter(x=>state.excluded.includes(x));
    return `<div class="card ev">
      <div class="ev-head"><div class="bottle">🧴</div><div><b>${esc(pr.name)}</b><span class="muted">${esc(tx(c.name))} · ${t("t_"+c.type)}</span></div></div>
      <dl class="kv"><dt>${t("brand")}</dt><dd>${esc(pr.brand)}</dd><dt>${t("country")}</dt><dd>${esc(pr.country)}</dd><dt>${t("size")}</dt><dd>${esc(pr.size)}</dd>
        <dt>${t("labelChecked")}</dt><dd>${pr.checked}</dd><dt>${t("by")}</dt><dd>${t("operator")}</dd></dl>
      <div class="label-box"><div><small>${t("original")}</small>${esc(pr.label)}</div><div><small>${t("aiReading")}</small>${esc(pr.ai)}</div></div>
      ${hits.length?`<div class="found ${r.s==="contains"?"contains":"check"}">${t("found")} ${esc(catNames(hits))}</div>`:`<div class="found ok">✓ ${t("noneFound")}</div>`}
      ${restLine}</div>`;
  }).join("");
  const recipe=m.comps.filter(c=>c.type==="ingredient"&&!c.product||c.type==="side");
  setView(`
    <h1>${t("evidence")}</h1><p class="sub">${esc(tx(m.name))} — ${t("evidenceSub")}</p>
    ${statusBox(judgeMenu(m))}
    ${cards}
    <div class="card ev"><b>${t("recipe")}</b><div class="chips" style="margin-top:8px">${recipe.map(c=>{const r=judgeComp(c);return `<span class="comp ${r.s==="ok"?"":r.s}">${esc(tx(c.name))}</span>`;}).join("")}</div></div>
    <div class="stack"><button class="btn" data-korean="${id}">${t("showKorean")}</button><button class="btn ghost" data-report="${id}">${t("report")}</button></div>
    <p class="footer-note">${t("disclaimer")}</p>`);
}

function viewSaved(){
  renderTop();renderTabs("saved");
  const items=state.saved.filter(id=>MENUS[id]).map(id=>{const m=MENUS[id];const j=judgeMenu(m);const p=PLACES.find(x=>x.id===m.place);
    return `<a class="card menu-row" href="#/menu/${id}"><div class="thumb">${m.emoji}</div><div style="flex:1;min-width:0"><div style="font-weight:700">${esc(tx(m.name))}</div><div class="muted">${esc(tx(p.name))}</div><div class="counts"><span class="badge ${j.s}">${ST_ICON[j.s]} ${t("st_"+j.s)}</span></div></div><span class="chev">›</span></a>`;}).join("");
  const reps=state.reports.slice().reverse().map(r=>{const m=MENUS[r.menu];return `<div class="card report"><b>${m?esc(tx(m.name)):""}</b> · <span class="badge check">${t("underReview")}</span><div class="muted">${esc(r.date)} · ${t(r.type)}</div>${r.text?`<div>${esc(r.text)}</div>`:""}</div>`;}).join("");
  setView(`<h1>${t("savedTitle")}</h1>
    <div class="list">${items||`<div class="card empty"><div class="big">☆</div><p class="muted">${t("savedEmpty")}</p></div>`}</div>
    ${reps?`<h2>${t("myReports")}</h2><div class="list" style="margin-top:0">${reps}</div>`:""}`);
}
function viewNotFound(){renderTop("#/explore");renderTabs("");setView(`<div class="empty"><div class="big">🍃</div><p>${t("notFound")}</p><a class="btn" href="#/explore">${t("explore")}</a></div>`);}

// ---------- modal ----------
function openModal(html){document.getElementById("sheet").innerHTML=html;document.getElementById("modal").classList.add("open");const f=document.querySelector("#sheet button, #sheet select");if(f)f.focus();}
function closeModal(){document.getElementById("modal").classList.remove("open");}
function koreanRequest(id){
  const m=MENUS[id];
  const ex=state.excluded.map(c=>CAT[c].ko).join(", ");
  const exEn=state.excluded.map(c=>CAT[c].en.toLowerCase()).join(", ");
  const pend=m.comps.filter(c=>c.rest!=="confirmed"||c.unknown);
  const partsKo=pend.map(c=>c.name.ko).join(", ");
  const partsEn=pend.map(c=>c.name.en.toLowerCase()).join(", ");
  const ko=`안녕하세요. 저는 ${ex}${josa(ex,"을","를")} 먹지 않아요.<br>'${esc(m.name.ko)}'의 ${pend.length?esc(partsKo)+"에":"재료나 양념에"} 이 재료가 들어가는지 확인해 주실 수 있을까요?<br>감사합니다.`;
  const en=`Hello. I don't eat ${exEn}. Could you check whether the ${pend.length?esc(partsEn)+" of":"ingredients or sauces in"} '${esc(m.name.en)}' contain any of these? Thank you.`;
  openModal(`<h2>${t("koReqTitle")}</h2><div class="ko-req" lang="ko">${ko}</div>
    <p class="muted" style="margin-top:12px"><b>${t("koReqSub")}</b> ${en}</p>
    <div class="stack"><button class="btn ghost" data-close>${t("close")}</button></div>`);
}
function reportForm(id){
  openModal(`<h2>${t("reportTitle")}</h2><p class="sub">${t("reportSub")}</p>
    <form id="rf">
      <div class="field"><label for="rtype">${t("reportType")}</label>
        <select id="rtype">${["rt1","rt2","rt3"].map(k=>`<option value="${k}">${t(k)}</option>`).join("")}</select></div>
      <div class="field"><label for="rtext">${t("details")}</label><textarea id="rtext" maxlength="500"></textarea></div>
      <div class="stack"><button class="btn" type="submit">${t("submit")}</button><button class="btn ghost" type="button" data-close>${t("close")}</button></div>
    </form>`);
  document.getElementById("rf").addEventListener("submit",e=>{
    e.preventDefault();
    state.reports.push({menu:id,type:document.getElementById("rtype").value,text:document.getElementById("rtext").value.trim(),date:new Date().toISOString().slice(0,10),status:"review"});
    persist();closeModal();toast(t("reportDone"));
  });
}
function toast(msg){const el=document.getElementById("toast");el.textContent=msg;el.classList.add("show");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("show"),2200);}

// ---------- events ----------
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-lang],[data-diet],[data-cat],[data-area],[data-save],[data-korean],[data-report],[data-close],[data-back],[data-block]");
  if(!b){if(e.target.id==="modal")closeModal();return;}
  const d=b.dataset;
  if(d.block){e.preventDefault();toast(t("noneSel"));return;}
  if(d.lang){state.lang=d.lang;document.documentElement.lang=d.lang;persist();route();}
  else if(d.diet){state.diet=d.diet;if(DIETS[d.diet])state.excluded=[...DIETS[d.diet]];persist();viewSetup();}
  else if(d.cat){const c=d.cat;state.excluded=state.excluded.includes(c)?state.excluded.filter(x=>x!==c):[...state.excluded,c];
    state.excluded=CATS.filter(x=>state.excluded.includes(x));
    const match=Object.keys(DIETS).find(k=>DIETS[k].length===state.excluded.length&&DIETS[k].every(x=>state.excluded.includes(x)));
    state.diet=match||"custom";persist();viewSetup();}
  else if(d.area){state.area=d.area;persist();viewExplore();}
  else if(d.save){const id=d.save;const on=state.saved.includes(id);state.saved=on?state.saved.filter(x=>x!==id):[...state.saved,id];persist();toast(on?t("unsavedToast"):t("savedToast"));viewMenu(id);}
  else if(d.korean)koreanRequest(d.korean);
  else if(d.report)reportForm(d.report);
  else if(d.close!==undefined)closeModal();
  else if(d.back){location.hash=d.back;}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();});

// ---------- router ----------
const L_=window.L;
function route(){
  closeModal();
  const h=location.hash.replace(/^#\/?/,"");const [page,id]=h.split("/");
  if(page!=="explore")killMap();
  document.documentElement.lang=lg();
  if(!page)return location.replace(state.excluded.length&&localStorageHas()?"#/explore":"#/setup");
  ({setup:viewSetup,explore:viewExplore,place:()=>viewPlace(id),menu:()=>viewMenu(id),evidence:()=>viewEvidence(id),saved:viewSaved}[page]||viewNotFound)();
}
function localStorageHas(){try{return !!localStorage.getItem(STORE_KEY);}catch(e){return false;}}
window.addEventListener("hashchange",route);
route();
</script>

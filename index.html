<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LeafMap Dashboard</title>
<meta name="description" content="리프맵 — 부산 채식 여행자를 위한 메뉴 성분 확인 대시보드 시제품">
<meta name="theme-color" content="#245c45">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23245c45'/%3E%3Cpath d='M18 46c0-18 12-28 30-28 0 18-10 30-28 30l-2-2z' fill='%23e8f1ea'/%3E%3Cpath d='M20 44 40 26' stroke='%23245c45' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{
    --green:#245c45; --green-2:#2f7457; --green-soft:#e8f1ea; --green-line:#c9dfd0;
    --amber:#9a5b06; --amber-bar:#d99520; --amber-soft:#fff3dc; --amber-line:#f1d7a6;
    --red:#a8322a; --red-bar:#c9564c; --red-soft:#fdecea; --red-line:#f2c4bf;
    --ink:#1d2a24; --ink-2:#55635c; --ink-3:#8a968f;
    --bg:#f3f2ec; --card:#ffffff; --line:#e3e6e1; --row:#f8f8f4;
    --shadow:0 1px 2px rgba(20,40,30,.05),0 3px 10px rgba(20,40,30,.05);
    --r:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  a{color:var(--green)}
  h1,h2,h3{margin:0;letter-spacing:-.3px}

  /* header */
  .top{position:sticky;top:0;z-index:600;background:#fff;border-bottom:1px solid var(--line)}
  .top-in{max-width:1480px;margin:0 auto;display:flex;align-items:center;gap:20px;padding:12px 24px}
  .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:20px;color:var(--green)}
  .brand svg{width:22px;height:22px}
  .brand small{font-size:12px;font-weight:500;color:var(--ink-3);margin-left:4px}
  .tabs{display:flex;gap:4px;background:var(--bg);border-radius:12px;padding:4px}
  .tabs button{border:0;background:none;padding:7px 16px;border-radius:9px;font-weight:500;color:var(--ink-2)}
  .tabs button[aria-selected="true"]{background:#fff;color:var(--green);font-weight:700;box-shadow:var(--shadow)}
  .spacer{flex:1}
  .demo{font-size:12px;color:var(--amber);background:var(--amber-soft);border:1px solid var(--amber-line);border-radius:999px;padding:3px 10px;white-space:nowrap}
  .lang{display:flex;background:var(--green-soft);border-radius:999px;padding:3px}
  .lang button{border:0;background:none;padding:4px 11px;border-radius:999px;font-size:13px;font-weight:500;color:var(--green)}
  .lang button[aria-pressed="true"]{background:var(--green);color:#fff}

  main{max-width:1480px;margin:0 auto;padding:20px 24px 40px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
  .pad{padding:16px}
  .ctitle{font-size:15px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .ctitle small{font-weight:400;color:var(--ink-3);font-size:12px}
  .muted{color:var(--ink-3);font-size:12.5px}

  /* traveler grid */
  .tgrid{display:grid;grid-template-columns:270px minmax(0,1fr) 400px;gap:16px;align-items:start}
  .col{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;min-width:0}
  .sticky{position:sticky;top:76px;max-height:calc(100vh - 92px);overflow:auto}
  .opts{display:grid;gap:6px}
  .opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:9px 11px}
  .opt .dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink-3);flex:none;margin-top:3px;display:grid;place-items:center}
  .opt[aria-checked="true"]{border-color:var(--green);background:var(--green-soft)}
  .opt[aria-checked="true"] .dot{border-color:var(--green)}
  .opt[aria-checked="true"] .dot::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--green)}
  .opt b{display:block;font-size:13.5px}
  .opt span{font-size:12px;color:var(--ink-2)}
  .label{font-size:12px;font-weight:700;color:var(--ink-2);margin:14px 0 6px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{border:1.5px solid var(--green-line);background:#fff;color:var(--green);border-radius:9px;padding:5px 10px;font-weight:500;font-size:13px}
  .chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
  .chip[aria-pressed="true"]::before{content:"✓ ";font-size:11px}
  .note{border-radius:10px;padding:8px 10px;font-size:12px;margin-top:8px}
  .note.info{background:var(--green-soft);color:var(--green)}
  .note.warn{background:var(--amber-soft);color:var(--amber)}
  .seg{display:flex;gap:4px;flex-wrap:wrap}
  .seg button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:500}
  .seg button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .search{display:flex;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 11px;flex:1;min-width:200px}
  .search input{border:0;outline:0;flex:1;background:none;min-width:0}
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .sum{display:flex;gap:8px;flex-wrap:wrap}
  .sumbtn{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:6px 11px;font-size:13px}
  .sumbtn b{font-size:15px}
  .sumbtn[aria-pressed="false"]{opacity:.45}
  .sumbtn.ok b{color:var(--green)} .sumbtn.check b{color:var(--amber)} .sumbtn.contains b{color:var(--red)}
  #map{height:330px;border-radius:var(--r);border:1px solid var(--line);overflow:hidden;background:#e6ece7;z-index:0}
  .pin{width:34px;height:34px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);display:grid;place-items:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25)}
  .pin span{transform:rotate(45deg);color:#fff;font-weight:700;font-size:13px}
  .pin.ok{background:var(--green)} .pin.check{background:var(--amber-bar)} .pin.none{background:#9aa39e}
  .pin.sel{outline:3px solid var(--ink)}
  .placechip{display:inline-flex;gap:6px;align-items:center;background:var(--ink);color:#fff;border:0;border-radius:999px;padding:5px 12px;font-size:12.5px}

  table{width:100%;border-collapse:collapse}
  th{font-size:12px;color:var(--ink-3);font-weight:500;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
  tbody tr:last-child td{border-bottom:0}
  tr.click{cursor:pointer}
  tr.click:hover td{background:var(--row)}
  tr.sel td{background:var(--green-soft)}
  .mname{display:flex;align-items:center;gap:10px;font-weight:500}
  .emo{width:34px;height:34px;border-radius:9px;background:#f1ece2;display:grid;place-items:center;font-size:18px;flex:none}
  .badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;border-radius:999px;padding:2px 9px;white-space:nowrap}
  .badge.ok{background:var(--green-soft);color:var(--green)}
  .badge.check,.badge.review{background:var(--amber-soft);color:var(--amber)}
  .badge.contains{background:var(--red-soft);color:var(--red)}
  .badge.gray{background:#eef0ec;color:var(--ink-2)}
  .empty{text-align:center;padding:30px 16px;color:var(--ink-2)}

  /* detail panel */
  .hero{height:120px;border-radius:12px;background:#f1ece2;display:grid;place-items:center;font-size:56px;position:relative;margin-bottom:12px}
  .save{position:absolute;top:8px;right:8px;background:#fff;border:0;border-radius:9px;width:36px;height:36px;font-size:16px;box-shadow:var(--shadow)}
  .status{display:flex;gap:10px;align-items:flex-start;border-radius:11px;padding:10px 12px;margin:10px 0;border:1px solid;font-size:13px}
  .status b{display:block}
  .status.ok{background:var(--green-soft);border-color:var(--green-line);color:var(--green)}
  .status.check{background:var(--amber-soft);border-color:var(--amber-line);color:var(--amber)}
  .status.contains{background:var(--red-soft);border-color:var(--red-line);color:var(--red)}
  .comp{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:4px 10px;font-size:12.5px;background:#eef0ec;border:1px solid transparent}
  .comp.check{background:var(--amber-soft);border-color:var(--amber-line);color:var(--amber)}
  .comp.contains{background:var(--red-soft);border-color:var(--red-line);color:var(--red)}
  .grp h4{font-size:12px;color:var(--ink-2);margin:10px 0 5px;font-weight:500}
  .sect{font-size:13px;font-weight:700;margin:18px 0 4px;padding-top:14px;border-top:1px solid var(--line)}
  .ev{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}
  .ev-head{display:flex;gap:10px;align-items:center}
  .ev-head b{display:block;font-size:13.5px}
  .bottle{width:40px;height:40px;border-radius:9px;background:var(--green-soft);display:grid;place-items:center;font-size:20px;flex:none}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:12.5px;margin-top:8px}
  .kv dt{color:var(--ink-3)} .kv dd{margin:0}
  .lbl{background:#f4f3ee;border-radius:9px;padding:7px 10px;font-size:12.5px;margin-top:6px}
  .lbl small{display:block;color:var(--ink-3);font-size:11px;font-weight:500}
  .found{font-size:12.5px;border-radius:9px;padding:6px 10px;margin-top:8px}
  .found.ok{background:var(--green-soft);color:var(--green)}
  .found.contains{background:var(--red-soft);color:var(--red)}
  .found.check{background:var(--amber-soft);color:var(--amber)}
  .rest{display:flex;gap:8px;font-size:12.5px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
  .btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;border:0;border-radius:10px;padding:11px;font-weight:700;background:var(--green);color:#fff;font-size:14px}
  .btn.ghost{background:#fff;color:var(--green);border:1.5px solid var(--green)}
  .btn.sm{display:inline-flex;width:auto;padding:5px 10px;font-size:12px;border-radius:8px;font-weight:500}
  .stack{display:grid;gap:8px;margin-top:14px}
  .placeholder{text-align:center;color:var(--ink-3);padding:60px 20px}
  .placeholder .big{font-size:40px}

  /* ops */
  .kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
  .kpi{padding:14px 16px}
  .kpi .k{font-size:12.5px;color:var(--ink-2)}
  .kpi .v{font-size:28px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
  .kpi .v small{font-size:14px;color:var(--ink-3);font-weight:500}
  .kpi.warn .v{color:var(--amber)}
  .prog{height:6px;border-radius:99px;background:#eef0ec;margin-top:8px;overflow:hidden}
  .prog i{display:block;height:100%;background:var(--green);border-radius:99px}
  .ogrid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;margin-top:16px;align-items:start}
  .full{grid-column:1/-1}
  .flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
  .step{background:var(--row);border:1px solid var(--line);border-radius:12px;padding:12px;position:relative}
  .step .n{font-size:24px;font-weight:700;color:var(--green)}
  .step .s{font-size:12.5px;color:var(--ink-2)}
  .step:not(:last-child)::after{content:"→";position:absolute;right:-12px;top:50%;transform:translateY(-50%);color:var(--green);font-weight:700}
  .srow{display:grid;grid-template-columns:110px minmax(0,1fr) 92px;gap:10px;align-items:center;margin:9px 0;font-size:13px}
  .sbar{display:flex;height:22px;border-radius:7px;overflow:hidden;background:#eef0ec;gap:2px}
  .sbar i{display:block;height:100%}
  .sbar .ok{background:var(--green)} .sbar .check{background:var(--amber-bar)} .sbar .contains{background:var(--red-bar)}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
  .legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}
  .vbars{display:flex;align-items:flex-end;gap:28px;height:170px;padding:10px 10px 0;border-bottom:1px solid var(--line)}
  .vb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
  .vb i{display:block;width:60%;max-width:70px;background:var(--green);border-radius:6px 6px 0 0}
  .vb b{font-size:13px}
  .vlabels{display:flex;gap:28px;padding:6px 10px 0}
  .vlabels span{flex:1;text-align:center;font-size:12px;color:var(--ink-2)}
  .tbl-wrap{overflow-x:auto}

  /* modal + toast */
  .modal{position:fixed;inset:0;background:rgba(15,25,20,.45);display:none;align-items:center;justify-content:center;z-index:1000;padding:16px}
  .modal.open{display:flex}
  .sheet{background:#fff;width:100%;max-width:520px;border-radius:18px;padding:22px;max-height:88vh;overflow:auto}
  .sheet h2{font-size:18px;margin-bottom:8px}
  .ko-req{font-size:20px;line-height:1.7;background:var(--green-soft);border-radius:12px;padding:16px;font-weight:500}
  .field{display:grid;gap:5px;margin-top:12px}
  .field label{font-size:12.5px;font-weight:500;color:var(--ink-2)}
  .field select,.field textarea{border:1px solid var(--line);border-radius:9px;padding:9px;background:#fff;width:100%}
  .field textarea{min-height:90px;resize:vertical}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(16px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:13.5px;opacity:0;transition:.25s;z-index:1100;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .foot{text-align:center;font-size:12px;color:var(--ink-3);margin-top:24px}
  :focus-visible{outline:2px solid var(--green);outline-offset:2px}

  @media (max-width:1200px){
    .tgrid{grid-template-columns:250px minmax(0,1fr)}
    .tgrid .right{grid-column:1/-1}
    .sticky{position:static;max-height:none}
    .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  }
  @media (max-width:820px){
    .top-in{flex-wrap:wrap;gap:10px;padding:10px 16px}
    .spacer{display:none}
    main{padding:16px}
    .tgrid,.ogrid{grid-template-columns:minmax(0,1fr)}
    .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
    .flow{grid-template-columns:repeat(2,minmax(0,1fr))}
    .step:not(:last-child)::after{display:none}
    .srow{grid-template-columns:80px minmax(0,1fr) 80px}
    .hide-m{display:none}
  }
</style>
</head>
<body>
<header class="top"><div class="top-in" id="top"></div></header>
<main id="main"></main>
<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast" role="status"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* =========================================================
   LeafMap dashboard prototype
   식당·제품·성분표는 모두 화면 검증용 가상 데이터입니다.
   ========================================================= */

const T = {
  sub:{en:"Busan vegetarian menu dashboard",ko:"부산 채식 메뉴 확인 대시보드"},
  tabT:{en:"Traveler",ko:"여행자 탐색"}, tabO:{en:"Operations",ko:"운영 현황"},
  demo:{en:"Demo data · fictional restaurants",ko:"시연용 가상 데이터"},
  prefs:{en:"Food preferences",ko:"식단 설정"},
  vegan:{en:"Vegan",ko:"비건"}, veganD:{en:"No animal products",ko:"동물성 식품 모두 제외"},
  lacto:{en:"Lacto-ovo",ko:"락토오보 채식"}, lactoD:{en:"No meat, fish or seafood",ko:"육류·생선·해산물 제외"},
  pesco:{en:"Pescatarian",ko:"페스코 식단"}, pescoD:{en:"No meat",ko:"육류만 제외"},
  custom:{en:"Custom",ko:"직접 설정"}, customD:{en:"Your own list",ko:"내가 고른 재료만 제외"},
  exclude:{en:"Excluded ingredients",ko:"제외 재료"},
  lactoNote:{en:"Do you eat eggs and dairy? Tick them if not.",ko:"달걀·유제품을 드시는지 다시 확인해 주세요."},
  pescoNote:{en:"Do you eat fish and seafood? Tick them if not.",ko:"생선·해산물을 드시는지 다시 확인해 주세요."},
  veganNote:{en:"Based on The Vegan Society's definition.",ko:"The Vegan Society의 정의를 참고했어요."},
  noneSel:{en:"Pick at least one ingredient to exclude.",ko:"제외할 재료를 하나 이상 골라 주세요."},
  area:{en:"Area",ko:"지역"},
  all:{en:"All Busan",ko:"부산 전체"}, haeundae:{en:"Haeundae",ko:"해운대"}, seomyeon:{en:"Seomyeon",ko:"서면"},
  search:{en:"Search restaurants or menus",ko:"식당이나 메뉴 검색"},
  menuList:{en:"Menus",ko:"메뉴 목록"},
  colMenu:{en:"Menu",ko:"메뉴"}, colPlace:{en:"Restaurant",ko:"식당"}, colArea:{en:"Area",ko:"지역"}, colStatus:{en:"Status",ko:"판정"},
  st_ok:{en:"Matches",ko:"조건에 맞음"}, st_check:{en:"Needs confirmation",ko:"추가 확인 필요"}, st_contains:{en:"Contains excluded",ko:"제외 재료 포함"},
  st_okD:{en:"Label checked and confirmed by the restaurant.",ko:"성분표 확인과 식당 사용 확인을 모두 마쳤어요."},
  st_checkD:{en:"Some parts are not confirmed yet. Ask before ordering.",ko:"아직 확인되지 않은 부분이 있어요. 주문 전에 식당에 물어보세요."},
  st_containsD:{en:"Restaurant confirmed it uses:",ko:"식당이 사용을 확인한 제외 재료:"},
  flaggedD:{en:"A correction report is being re-checked.",ko:"정정 제보가 접수되어 다시 확인하고 있어요."},
  noResults:{en:"No menus match these filters.",ko:"조건에 맞는 메뉴가 없어요."},
  noResultsTip:{en:"Try another area, clear the search, or turn on more status filters.",ko:"다른 지역을 고르거나 검색어를 지우거나 판정 필터를 켜 보세요."},
  pick:{en:"Select a menu to see its ingredients and evidence.",ko:"메뉴를 선택하면 재료와 성분 근거를 보여드려요."},
  t_ingredient:{en:"Ingredients",ko:"기본 재료"}, t_broth:{en:"Broth",ko:"육수"}, t_sauce:{en:"Sauce",ko:"소스·양념"}, t_side:{en:"Side dishes",ko:"반찬"},
  evidence:{en:"Ingredient evidence",ko:"성분 근거"},
  original:{en:"Label (original)",ko:"성분표 원문"}, aiReading:{en:"AI reading",ko:"AI 해석"},
  brand:{en:"Brand",ko:"브랜드"}, country:{en:"Sold in",ko:"판매 국가"}, size:{en:"Size",ko:"용량"},
  labelChecked:{en:"Label checked",ko:"성분표 확인일"}, by:{en:"Checked by",ko:"확인 주체"},
  operator:{en:"AI draft + LeafMap reviewer",ko:"AI 초안 + 리프맵 검토자"},
  restConfirmed:{en:"Restaurant confirmed use",ko:"식당 사용 확인 완료"},
  restPending:{en:"Restaurant review pending",ko:"식당 확인 대기"},

// ---------- judgement (follows the plan's three status rules) ----------
const flagged=()=>state.reports.filter(r=>r.status==="flagged").map(r=>r.menu);
function compContains(c){return c.product?PRODUCTS[c.product].contains:(c.contains||[]);}
function judgeComp(c,ex=state.excluded){
  const hits=compContains(c).filter(x=>ex.includes(x));
  if(c.unknown)return{s:"check",hits:[]};
  if(c.rest==="confirmed"&&hits.length)return{s:"contains",hits};
  if(c.rest!=="confirmed")return{s:"check",hits};
  return{s:"ok",hits:[]};
}
function judgeMenu(m,ex=state.excluded){
  const r=m.comps.map(c=>judgeComp(c,ex));
  const hits=[...new Set(r.filter(x=>x.s==="contains").flatMap(x=>x.hits))];
  if(hits.length)return{s:"contains",hits};
  if(r.some(x=>x.s==="check")||flagged().includes(m.id))return{s:"check",hits:[],flag:flagged().includes(m.id)};
  return{s:"ok",hits:[]};
}

    </div>

  $("q").addEventListener("input",e=>{state.q=e.target.value;persist();renderList();renderMarkers();});
  initMap();renderLeft();renderList();renderMarkers();renderRight();
}

function renderLeft(){
  const note=state.diet==="lacto"?`<div class="note warn">${t("lactoNote")}</div>`:state.diet==="pesco"?`<div class="note warn">${t("pescoNote")}</div>`:state.diet==="vegan"?`<div class="note info">${t("veganNote")}</div>`:"";
  $("left").innerHTML=`
    <div class="ctitle">${t("prefs")}</div>
    <div class="opts" role="radiogroup">${["vegan","lacto","pesco","custom"].map(d=>`
      <button class="opt" role="radio" aria-checked="${state.diet===d}" data-diet="${d}"><i class="dot"></i><div><b>${t(d)}</b><span>${t(d+"D")}</span></div></button>`).join("")}</div>
    ${note}
    <div class="label">${t("exclude")}</div>
    <div class="chips">${CATS.map(c=>`<button class="chip" data-cat="${c}" aria-pressed="${state.excluded.includes(c)}">${tx(CAT[c])}</button>`).join("")}</div>
    ${state.excluded.length?"":`<div class="note warn">${t("noneSel")}</div>`}
    <div class="label">${t("area")}</div>
    <div class="seg">${["all","haeundae","seomyeon"].map(a=>`<button data-area="${a}" aria-pressed="${state.area===a}">${t(a)}</button>`).join("")}</div>`;
}

function visibleMenus(){
  const q=state.q.trim().toLowerCase();
  return Object.values(MENUS).filter(m=>{
    const p=placeOf(m.place);
    if(state.area!=="all"&&p.area!==state.area)return false;
    if(state.place&&m.place!==state.place)return false;
    if(q&&![m.name.en,m.name.ko,p.name.en,p.name.ko].some(s=>s.toLowerCase().includes(q)))return false;
    return true;
  }).map(m=>({m,j:judgeMenu(m)}));
}

function renderList(){
  const all=visibleMenus();
  const cnt={ok:0,check:0,contains:0};all.forEach(x=>cnt[x.j.s]++);
  $("sum").innerHTML=["ok","check","contains"].map(s=>`<button class="sumbtn ${s}" data-show="${s}" aria-pressed="${state.show[s]}"><b>${cnt[s]}</b>${t("st_"+s)}</button>`).join("");
  const rows=all.filter(x=>state.show[x.j.s]).sort((a,b)=>ORDER[a.j.s]-ORDER[b.j.s]);
  const pc=state.place?`<button class="placechip" data-clearplace>${t("filterPlace")}: ${esc(tx(placeOf(state.place).name))} ✕</button>`:"";
  $("list").innerHTML=`<div class="ctitle">${t("menuList")} <small>${rows.length}</small>${pc}</div>`+(rows.length?`
    <div class="tbl-wrap"><table><thead><tr><th>${t("colMenu")}</th><th>${t("colPlace")}</th><th class="hide-m">${t("colArea")}</th><th>${t("colStatus")}</th></tr></thead><tbody>
    ${rows.map(({m,j})=>{const p=placeOf(m.place);return `<tr class="click ${state.sel===m.id?"sel":""}" data-menu="${m.id}" tabindex="0">
      <td><div class="mname"><span class="emo">${m.emoji}</span>${esc(tx(m.name))}</div></td>
      <td>${esc(tx(p.name))}</td><td class="hide-m">${t(p.area)}</td>
      <td><span class="badge ${j.s}">${ICO[j.s]} ${t("st_"+j.s)}</span></td></tr>`;}).join("")}
    </tbody></table></div>`:`<div class="empty"><b>${t("noResults")}</b><p class="muted">${t("noResultsTip")}</p></div>`);
}

function initMap(){
  const L_=window.L;const el=$("map");if(!L_||!el)return;
  map=L_.map(el,{zoomControl:true,scrollWheelZoom:false}).setView([35.161,129.11],12);
  L_.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap"}).addTo(map);
  markerLayer=L_.layerGroup().addTo(map);
  fitArea();
}
function fitArea(){
  if(!map)return;
  const c={all:[35.161,129.11,12],haeundae:[35.1612,129.1615,15],seomyeon:[35.1573,129.061,15]}[state.area];
  map.setView([c[0],c[1]],c[2]);
}
function renderMarkers(){
  if(!map||!markerLayer)return;const L_=window.L;markerLayer.clearLayers();
  const vis=visibleMenus();
  PLACES.forEach(p=>{
    if(state.area!=="all"&&p.area!==state.area)return;
    const ms=vis.filter(x=>x.m.place===p.id);if(!ms.length&&!state.place)return;
    const ok=ms.filter(x=>x.j.s==="ok").length,ch=ms.filter(x=>x.j.s==="check").length;
    const cls=ok?"ok":ch?"check":"none";
    const icon=L_.divIcon({className:"",html:`<div class="pin ${cls} ${state.place===p.id?"sel":""}"><span>${ok||ch}</span></div>`,iconSize:[34,34],iconAnchor:[17,34]});
    L_.marker([p.lat,p.lng],{icon,title:tx(p.name)}).addTo(markerLayer)
      .bindTooltip(`${esc(tx(p.name))} · ${ok} ${t("st_ok")} · ${ch} ${t("st_check")}`)
      .on("click",()=>{state.place=state.place===p.id?null:p.id;persist();renderList();renderMarkers();});
  });
}

function statusBox(j){
  const d=j.s==="contains"?`${t("st_containsD")} ${esc(catNames(j.hits))}`:(j.flag?t("flaggedD"):t("st_"+j.s+"D"));
  return `<div class="status ${j.s}"><span>${ICO[j.s]}</span><div><b>${t("st_"+j.s)}</b>${d}</div></div>`;
}
function evidenceCards(m){
  return m.comps.filter(c=>c.product||c.unknown||c.type==="broth"||c.type==="sauce").map(c=>{
    const r=judgeComp(c);
    const restLine=c.rest==="confirmed"
      ?`<div class="rest"><span>✓</span><div><b>${t("restConfirmed")}</b> <span class="muted">${c.restDate||""}</span></div></div>`
      :`<div class="rest" style="color:var(--amber)"><span>⏱</span><div><b>${t("restPending")}</b><div>${t("restPendingD")}</div></div></div>`;
    if(c.unknown)return `<div class="ev"><div class="ev-head"><div class="bottle">❔</div><div><b>${esc(tx(c.name))}</b><span class="muted">${t("t_"+c.type)}</span></div></div>
      <div class="found check"><b>${t("unknownProd")}</b> — ${t("unknownProdD")}</div>${restLine}</div>`;
    if(!c.product){const hits=(c.contains||[]).filter(x=>state.excluded.includes(x));
      return `<div class="ev"><div class="ev-head"><div class="bottle">🥣</div><div><b>${esc(tx(c.name))}</b><span class="muted">${t("t_"+c.type)} · ${t("houseMade")}</span></div></div>
      ${hits.length?`<div class="found ${r.s}">${t("found")} ${esc(catNames(hits))}</div>`:`<div class="found ok">✓ ${t("noneFound")}</div>`}${restLine}</div>`;}
    const pr=PRODUCTS[c.product];const hits=pr.contains.filter(x=>state.excluded.includes(x));
    return `<div class="ev"><div class="ev-head"><div class="bottle">🧴</div><div><b>${esc(pr.name)}</b><span class="muted">${esc(tx(c.name))} · ${t("t_"+c.type)}</span></div></div>
      <dl class="kv"><dt>${t("brand")}</dt><dd>${esc(pr.brand)}</dd><dt>${t("country")}</dt><dd>${esc(pr.country)} · ${esc(pr.size)}</dd><dt>${t("labelChecked")}</dt><dd>${pr.checked}</dd><dt>${t("by")}</dt><dd>${t("operator")}</dd></dl>
      <div class="lbl"><small>${t("original")}</small>${esc(pr.label)}</div><div class="lbl"><small>${t("aiReading")}</small>${esc(pr.ai)}</div>
      ${hits.length?`<div class="found ${r.s==="contains"?"contains":"check"}">${t("found")} ${esc(catNames(hits))}</div>`:`<div class="found ok">✓ ${t("noneFound")}</div>`}
      ${restLine}</div>`;
  }).join("");
}
function renderRight(){
  const m=MENUS[state.sel];
  if(!m){$("right").innerHTML=`<div class="placeholder"><div class="big">🥢</div><p>${t("pick")}</p></div>`;return;}
  const p=placeOf(m.place);const j=judgeMenu(m);const saved=state.saved.includes(m.id);
  const groups=["ingredient","broth","sauce","side"].map(ty=>{const cs=m.comps.filter(c=>c.type===ty);if(!cs.length)return"";
    return `<div class="grp"><h4>${t("t_"+ty)}</h4><div class="chips">${cs.map(c=>{const r=judgeComp(c);return `<span class="comp ${r.s==="ok"?"":r.s}">${r.s!=="ok"?ICO[r.s]+" ":""}${esc(tx(c.name))}</span>`;}).join("")}</div></div>`;}).join("");
  $("right").innerHTML=`
    <div class="hero">${m.emoji}<button class="save" data-save="${m.id}" aria-pressed="${saved}" aria-label="save">${saved?"★":"☆"}</button></div>
    <div class="muted">${esc(tx(p.name))} · ${t(p.area)} · ${t("demoPlace")}</div>
    <h2 style="font-size:19px;margin:2px 0">${esc(tx(m.name))}</h2>
    <div class="muted" style="color:var(--ink-2)">${esc(tx(m.desc))}</div>
    ${statusBox(j)}${groups}
    <div class="sect">${t("evidence")}</div>${evidenceCards(m)}
    <div class="stack"><button class="btn" data-korean="${m.id}">${t("showKorean")}</button><button class="btn ghost" data-report="${m.id}">${t("report")}</button></div>`;
}

// =========================================================
// Operations tab
// =========================================================
function renderOps(){
  const menus=Object.values(MENUS);
  const comps=menus.flatMap(m=>m.comps.map(c=>({m,c})));
  const usedProducts=[...new Set(comps.filter(x=>x.c.product).map(x=>x.c.product))];
  const pendingItems=comps.filter(x=>x.c.unknown||x.c.rest!=="confirmed");
  const flagIds=flagged();
  const reviewReports=state.reports.filter(r=>r.status==="review");
  const identified=comps.filter(x=>!x.c.unknown).length;
  const confirmed=comps.filter(x=>x.c.rest==="confirmed"&&!x.c.unknown).length;

  const ex=state.opsDiet==="current"?state.excluded:DIETS[state.opsDiet];
  const byPlace=PLACES.map(p=>{const c={ok:0,check:0,contains:0};placeMenus(p.id).forEach(m=>c[judgeMenu(m,ex).s]++);return{p,c,n:placeMenus(p.id).length};});
  const tot={ok:0,check:0,contains:0};byPlace.forEach(x=>{tot.ok+=x.c.ok;tot.check+=x.c.check;tot.contains+=x.c.contains;});
  const maxT=Math.max(...TOURISTS.map(x=>x.v));

  const queue=[...pendingItems.map(({m,c})=>({m,item:tx(c.name),reason:c.unknown?"rUnknown":"rPending",next:c.unknown?"nUnknown":"nPending"})),
               ...flagIds.filter(id=>MENUS[id]).map(id=>({m:MENUS[id],item:"—",reason:"rFlag",next:"nFlag"}))];

  $("main").innerHTML=`
    <div class="kpis">
      ${kpi(t("kPlaces"),PLACES.length,GOAL.places)}
      ${kpi(t("kMenus"),menus.length,GOAL.menus)}
      <div class="card kpi"><div class="k">${t("kProducts")}</div><div class="v">${usedProducts.length}</div><div class="muted">${t("operator")}</div></div>
      <div class="card kpi warn"><div class="k">${t("kPending")}</div><div class="v">${queue.length}</div><div class="muted">${t("rUnknown")} · ${t("rPending")}</div></div>
      <div class="card kpi ${reviewReports.length?"warn":""}"><div class="k">${t("kReports")}</div><div class="v">${reviewReports.length}</div><div class="muted">${t("reports")}</div></div>
    </div>

    <div class="ogrid">
      <div class="card pad full">
        <div class="ctitle">${t("pipeline")} <small>${t("pipeSub")}</small></div>
        <div class="flow">
          ${step(comps.length,t("p1"))}${step(identified,t("p2"))}${step(identified,t("p3"))}${step(confirmed,t("p4"))}
        </div>
      </div>

      <div class="card pad">
        <div class="ctitle">${t("judge")}
          <div class="seg">${["current","vegan","lacto","pesco"].map(d=>`<button data-opsdiet="${d}" aria-pressed="${state.opsDiet===d}">${d==="current"?t("current"):t(d)}</button>`).join("")}</div>
        </div>
        ${byPlace.map(({p,c,n})=>`<div class="srow"><span>${esc(tx(p.name))}</span>
          <div class="sbar" role="img" aria-label="${c.ok} ${t("st_ok")}, ${c.check} ${t("st_check")}, ${c.contains} ${t("st_contains")}">
            ${["ok","check","contains"].map(s=>c[s]?`<i class="${s}" style="width:${c[s]/n*100}%" title="${t("st_"+s)} ${c[s]}"></i>`:"").join("")}</div>
          <span class="muted">${c.ok} / ${c.check} / ${c.contains}</span></div>`).join("")}
        <div class="legend" style="margin-top:12px">
          <span style="--c:var(--green)">${t("st_ok")} ${tot.ok}</span><span style="--c:var(--amber-bar)">${t("st_check")} ${tot.check}</span><span style="--c:var(--red-bar)">${t("st_contains")} ${tot.contains}</span>
        </div>
      </div>

      <div class="card pad">
        <div class="ctitle">${t("tourists")} <small>${t("touristsUnit")}</small></div>
        <div class="vbars" role="img" aria-label="${TOURISTS.map(x=>x.y+": "+x.v).join(", ")}">
          ${TOURISTS.map(x=>`<div class="vb"><b>${x.v}</b><i style="height:${x.v/maxT*82}%"></i></div>`).join("")}
        </div>
        <div class="vlabels">${TOURISTS.map(x=>`<span>${x.y}</span>`).join("")}</div>
        <p class="muted" style="margin:10px 0 0">${t("touristsSrc")}</p>
      </div>

      <div class="card pad">
        <div class="ctitle">${t("queue")} <small>${queue.length}</small></div>
        <div class="tbl-wrap"><table><thead><tr><th>${t("colMenu")}</th><th>${t("qItem")}</th><th>${t("qReason")}</th><th>${t("qNext")}</th></tr></thead><tbody>
        ${queue.map(q=>`<tr><td><b>${esc(tx(q.m.name))}</b><div class="muted">${esc(tx(placeOf(q.m.place).name))}</div></td><td>${esc(q.item)}</td>
          <td><span class="badge check">${t(q.reason)}</span></td><td class="muted" style="color:var(--ink-2)">${t(q.next)}</td></tr>`).join("")}
        </tbody></table></div>
      </div>

      <div class="card pad">
        <div class="ctitle">${t("products")} <small>${usedProducts.length}</small></div>
        <div class="tbl-wrap"><table><thead><tr><th>${t("pName")}</th><th>${t("country")}</th><th>${t("pAnimal")}</th><th>${t("labelChecked")}</th><th>${t("pUsed")}</th></tr></thead><tbody>
        ${Object.entries(PRODUCTS).map(([k,pr])=>{const used=comps.filter(x=>x.c.product===k).length;
          return `<tr><td><b>${esc(pr.name)}</b><div class="muted">${esc(pr.brand)}</div></td><td>${pr.country}</td>
          <td>${pr.contains.length?`<span class="badge contains">${esc(catNames(pr.contains))}</span>`:`<span class="badge gray">${t("none")}</span>`}</td>
          <td style="white-space:nowrap">${pr.checked}</td><td>${used}</td></tr>`;}).join("")}
        </tbody></table></div>
      </div>

      <div class="card pad full">
        <div class="ctitle">${t("reports")} <small>${state.reports.length}</small></div>
        ${state.reports.length?`<div class="tbl-wrap"><table><thead><tr><th>${t("rDate")}</th><th>${t("colMenu")}</th><th>${t("rType")}</th><th>${t("rText")}</th><th>${t("rStatus")}</th><th></th></tr></thead><tbody>
        ${state.reports.slice().reverse().map(r=>{const m=MENUS[r.menu];const st={review:["review","sReview"],flagged:["check","sFlagged"],rejected:["gray","sRejected"]}[r.status];
          return `<tr><td style="white-space:nowrap">${esc(r.date)}</td><td><b>${m?esc(tx(m.name)):"—"}</b></td><td>${t(r.type)}</td><td>${r.text?esc(r.text):"—"}</td>
          <td><span class="badge ${st[0]}">${t(st[1])}</span></td>
          <td style="white-space:nowrap">${r.status==="review"?`<button class="btn sm" data-flag="${r.id}">${t("aFlag")}</button> <button class="btn sm ghost" data-reject="${r.id}">${t("aReject")}</button>`:""}</td></tr>`;}).join("")}
        </tbody></table></div>`:`<div class="empty">${t("noReports")}</div>`}
      </div>
    </div>
    <p class="foot">${t("foot")}</p>`;
}
function kpi(label,v,goal){return `<div class="card kpi"><div class="k">${label}</div><div class="v">${v} <small>/ ${goal}</small></div><div class="prog"><i style="width:${Math.min(100,v/goal*100)}%"></i></div><div class="muted" style="margin-top:4px">${t("goal")} ${goal}</div></div>`;}
function step(n,label){return `<div class="step"><div class="n">${n}</div><div class="s">${label}</div></div>`;}

// ---------- modal ----------
function openModal(html){$("sheet").innerHTML=html;$("modal").classList.add("open");const f=document.querySelector("#sheet button,#sheet select");if(f)f.focus();}
function closeModal(){$("modal").classList.remove("open");}
function koreanRequest(id){
  const m=MENUS[id];
  const ex=state.excluded.map(c=>CAT[c].ko).join(", ");
  const exEn=state.excluded.map(c=>CAT[c].en.toLowerCase()).join(", ");
  const pend=m.comps.filter(c=>c.rest!=="confirmed"||c.unknown);
  const ko=`안녕하세요. 저는 ${ex}${josa(ex,"을","를")} 먹지 않아요.<br>'${esc(m.name.ko)}'의 ${pend.length?esc(pend.map(c=>c.name.ko).join(", "))+"에":"재료나 양념에"} 이 재료가 들어가는지 확인해 주실 수 있을까요?<br>감사합니다.`;
  const en=`Hello. I don't eat ${exEn}. Could you check whether the ${pend.length?esc(pend.map(c=>c.name.en.toLowerCase()).join(", "))+" of":"ingredients or sauces in"} '${esc(m.name.en)}' contain any of these? Thank you.`;
  openModal(`<h2>${t("koReqTitle")}</h2><div class="ko-req" lang="ko">${ko}</div><p class="muted" style="margin-top:12px"><b>${t("koReqSub")}</b> ${en}</p>
    <div class="stack"><button class="btn ghost" data-close>${t("close")}</button></div>`);
}
function reportForm(id){
  openModal(`<h2>${t("report")} · ${esc(tx(MENUS[id].name))}</h2><p class="muted" style="color:var(--ink-2)">${t("reportSub")}</p>
    <form id="rf"><div class="field"><label for="rtype">${t("reportType")}</label><select id="rtype">${["rt1","rt2","rt3"].map(k=>`<option value="${k}">${t(k)}</option>`).join("")}</select></div>
    <div class="field"><label for="rtext">${t("details")}</label><textarea id="rtext" maxlength="500"></textarea></div>
    <div class="stack"><button class="btn" type="submit">${t("submit")}</button><button class="btn ghost" type="button" data-close>${t("close")}</button></div></form>`);
  $("rf").addEventListener("submit",e=>{e.preventDefault();
    state.reports.push({id:"r"+Date.now(),menu:id,type:$("rtype").value,text:$("rtext").value.trim(),date:new Date().toISOString().slice(0,10),status:"review"});
    persist();closeModal();toast(t("reportDone"));});
}
function toast(msg){const el=$("toast");el.textContent=msg;el.classList.add("show");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("show"),2200);}

// ---------- events ----------
function selectMenu(id){state.sel=id;persist();renderList();renderRight();
  if(window.innerWidth<=1200){const r=$("right");if(r)r.scrollIntoView({behavior:"smooth",block:"start"});}}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-tab],[data-lang],[data-diet],[data-cat],[data-area],[data-show],[data-menu],[data-clearplace],[data-save],[data-korean],[data-report],[data-close],[data-opsdiet],[data-flag],[data-reject]");
  if(!b){if(e.target.id==="modal")closeModal();return;}
  const d=b.dataset;
  if(d.tab){state.tab=d.tab;persist();render();}
  else if(d.lang){state.lang=d.lang;persist();render();}
  else if(d.diet){state.diet=d.diet;if(DIETS[d.diet])state.excluded=[...DIETS[d.diet]];persist();renderLeft();renderList();renderMarkers();renderRight();}
  else if(d.cat){const c=d.cat;state.excluded=state.excluded.includes(c)?state.excluded.filter(x=>x!==c):[...state.excluded,c];
    state.excluded=CATS.filter(x=>state.excluded.includes(x));
    state.diet=Object.keys(DIETS).find(k=>DIETS[k].length===state.excluded.length&&DIETS[k].every(x=>state.excluded.includes(x)))||"custom";
    persist();renderLeft();renderList();renderMarkers();renderRight();}
  else if(d.area){state.area=d.area;state.place=null;persist();renderLeft();fitArea();renderList();renderMarkers();}
  else if(d.show){state.show[d.show]=!state.show[d.show];persist();renderList();}
  else if(d.menu)selectMenu(d.menu);
  else if(d.clearplace!==undefined){state.place=null;persist();renderList();renderMarkers();}
  else if(d.save){const on=state.saved.includes(d.save);state.saved=on?state.saved.filter(x=>x!==d.save):[...state.saved,d.save];persist();toast(on?t("unsavedToast"):t("savedToast"));renderRight();}
  else if(d.korean)koreanRequest(d.korean);
  else if(d.report)reportForm(d.report);
  else if(d.close!==undefined)closeModal();
  else if(d.opsdiet){state.opsDiet=d.opsdiet;persist();renderOps();}
  else if(d.flag||d.reject){const r=state.reports.find(x=>x.id===(d.flag||d.reject));if(r){r.status=d.flag?"flagged":"rejected";persist();toast(t(d.flag?"flagToast":"rejToast"));renderOps();}}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape")closeModal();
  if(e.key==="Enter"){const tr=e.target.closest&&e.target.closest("[data-menu]");if(tr)selectMenu(tr.dataset.menu);}
});

render();
</script>
</body>
</html>
